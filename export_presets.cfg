html/head_include="<style>
#rotate-hint{display:none;position:fixed;inset:0;z-index:10;background:#0b0b0b;color:#e8843a;font:600 22px sans-serif;align-items:center;justify-content:center;text-align:center;padding:24px}
@media (orientation:portrait) and (pointer:coarse){#rotate-hint{display:flex}}
</style>
<script>
// Phones: ask the player to turn the phone sideways, and on the first tap go fullscreen
// in landscape where the browser allows it (Android Chrome; iOS Safari ignores it).
window.addEventListener('DOMContentLoaded', function () {
  var hint = document.createElement('div');
  hint.id = 'rotate-hint';
  hint.textContent = 'Turn your phone sideways to play';
  document.body.appendChild(hint);
});
if (matchMedia('(pointer:coarse)').matches) {
  window.addEventListener('touchend', function () {
    var el = document.documentElement;
    if (!el.requestFullscreen || document.fullscreenElement) return;
    el.requestFullscreen({ navigationUI: 'hide' }).then(function () {
      if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {});
    }).catch(function () {});
  }, { once: true });
}
</script>"
